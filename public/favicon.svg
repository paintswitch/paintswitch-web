<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Paint roller icon - simplified for favicon -->
  <defs>
    <linearGradient id="rollerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d99;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="#f5f1ed"/>

  <!-- Paint roller barrel (rounded rectangle) -->
  <rect x="52" y="60" width="88" height="48" rx="24" fill="url(#rollerGradient)"/>

  <!-- Roller handle -->
  <rect x="80" y="110" width="32" height="50" rx="8" fill="#003d99"/>

  <!-- Handle grip details -->
  <line x1="85" y1="120" x2="107" y2="120" stroke="#f5f1ed" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="135" x2="107" y2="135" stroke="#f5f1ed" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="150" x2="107" y2="150" stroke="#f5f1ed" stroke-width="2" stroke-linecap="round"/>
</svg>
